[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nexusmind"
version = "0.3.0"
description = "Local-first Agentic RAG engine - GraphRAG, hybrid retrieval, multi-agent orchestration, MCP-native, 100% local inference."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "NexusMind Contributors" }]
keywords = ["rag", "graphrag", "llm", "retrieval", "agents", "mcp", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.2",
  "sentence-transformers>=3.0",
  "docling>=2.0",
  "pypdf>=4.2",
  "pytesseract>=0.3.10",
  "faster-whisper>=1.0",
  "trafilatura>=1.12",
  "kuzu>=0.7",
  "qdrant-client>=1.9",
  "redis>=5.0",
  "rq>=1.16",
]
eval = [
  "ragas>=0.2",
  "jinja2>=3.1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-requests>=2.31",
  "pre-commit>=3.7",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "build>=1.2",
]

[project.scripts]
nexusmind = "nexusmind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusmind"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["examples", "docs"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=nexusmind --cov-report=term-missing --cov-fail-under=85"
markers = ["integration: requires Ollama and local models"]

[tool.coverage.run]
source = ["src/nexusmind"]
omit = ["src/nexusmind/cli.py", "src/nexusmind/mcp/server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true