name: eval-gate

on:
  pull_request:
    paths: ["src/nexusmind/retrieval/**", "src/nexusmind/ingestion/**"]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[eval,dev]"
      - name: Run golden eval (offline stub LLM)
        run: |
          pytest tests/test_eval.py -q
          python -m nexusmind.eval.harness --smoke